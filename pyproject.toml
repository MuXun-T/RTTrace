[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rttrace-analysis"
version = "0.1.0"
description = "Log-driven kernel task monitoring and visualization analysis core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = [
  "PySide6>=6.10,<6.11",
  "pyqtgraph>=0.14,<0.15",
  "numpy>=1.26"
]
dev = ["pytest>=8.0"]

[project.scripts]
rttrace-cli = "rttrace_cli:main"
rttrace-gui = "desktop.app.gui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["spec", "parser", "metric", "desktop", "p4_capture"]

[tool.setuptools.package-data]
spec = ["assets/*.json", "dictionary/*.json", "schema/*.json"]
p4_capture = ["schema/*.json"]
